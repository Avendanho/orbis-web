[pytest]
# As três etapas têm, cada uma, um pacote chamado `tests`. No modo de importação
# clássico do pytest os três disputam o mesmo nome (`tests`) em sys.modules e a
# coleta conjunta falha — daí só ser possível rodar uma etapa por vez. O modo
# importlib dá a cada módulo de teste um nome próprio e resolve a colisão.
addopts = --import-mode=importlib

testpaths =
    src/download/tests
    src/search/tests
    src/analysis/tests

filterwarnings =
    ignore::DeprecationWarning
